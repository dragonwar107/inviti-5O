<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito Speciale - Cena di Fine Anno</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #161f30;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #233554;
            transition: all 0.3s ease;
        }
        h1 {
            color: #64ffda;
            margin-bottom: 10px;
            font-size: 1.6rem;
            line-height: 1.3;
        }
        p {
            color: #8892b0;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .input-group {
            width: 100%;
            position: relative;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #233554;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #0a192f;
            color: #fff;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #64ffda;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.15);
        }
        button {
            background-color: #64ffda;
            color: #0a192f;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.2);
        }
        button:hover {
            background-color: #52d1b2;
        }
        button:active {
            transform: scale(0.98);
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            line-height: 1.4;
            font-size: 0.9rem;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        .invitation-container {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .invitation-container h3 {
            color: #64ffda;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .image-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 1px solid rgba(100, 255, 218, 0.2);
        }
        .invitation-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Ottimizzazioni per schermi piccolissimi (smartphone datati o mini) */
        @media (max-width: 360px) {
            h1 { font-size: 1.4rem; }
            button, input[type="text"] { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cerca il tuo Invito Speciale</h1>
    <p>Inserisci il tuo nome e cognome per visualizzare la sorpresa!</p>
    
    <div class="input-group">
        <input type="text" id="guestName" placeholder="Es: Mariateresa Turtoro">
        <br>
        <button onclick="checkInvitation()">Scopri l'invito</button>
    </div>

    <div id="errorMessage" class="error-message">Errore, puoi inserire solo il nome e il cognome dei prof della 5°O</div>

    <div id="invitationContainer" class="invitation-container">
        <h3>Ecco il tuo invito personalizzato! ✨</h3>
        <div class="image-wrapper">
            <img id="invitationImage" src="" alt="Invito Speciale" onerror="tryAlternativeExtension(this)">
        </div>
    </div>
</div>

<script>
    // LISTA COMPLETA DEI 16 PROFESSORI
    const guests = {
        "mariateresa turtoro": "mariateresa_turtoro.jpg",
        "gabriella campanile": "gabriella_campanile.jpg",
        "chiara maffia": "chiara_maffia.jpg",
        "clemente improta": "clemente_improta.jpg",
        "annamaria di marino": "annamaria_di_marino.jpg",
        "ornella spagnuolo": "ornella_spagnuolo.jpg",
        "anna guerriero napolano": "anna_guerriero_napolano.jpg",
        "carmen poziello": "carmen_poziello.jpg",
        "assunta bocchetti": "assunta_bocchetti.jpg",
        "claudia caracciolo": "claudia_caracciolo.jpg",
        "flora del prete": "flora_del_prete.jpg",
        "paolo pirozzi": "paolo_pirozzi.jpg",
        "massimiliano marchese": "massimiliano_marchese.jpg",
        "claudio ancelotti": "claudio_ancelotti.jpg",
        "giovanni russo": "giovanni_russo.jpg",
        "salvatore giordano": "salvatore_giordano.jpg"
    };

    // Funzione per generare un suono magico/scintillante sintetizzato al volo
    function playMagicSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            // Nota 1 (Arpeggio rapido)
            setTimeout(() => playTone(ctx, 523.25, 0.15), 0);   // Do5
            setTimeout(() => playTone(ctx, 659.25, 0.15), 100); // Mi5
            setTimeout(() => playTone(ctx, 783.99, 0.15), 200); // Sol5
            setTimeout(() => playTone(ctx, 1046.50, 0.4), 300); // Do6
        } catch (e) {
            console.log("Audio non supportato o bloccato dalle policy del browser.");
        }
    }

    function playTone(ctx, freq, duration) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    }

    function checkInvitation() {
        const inputRaw = document.getElementById('guestName').value.trim().toLowerCase();
        const errorDiv = document.getElementById('errorMessage');
        const inviteContainer = document.getElementById('invitationContainer');
        const inviteImg = document.getElementById('invitationImage');

        if (!inputRaw) return;

        let foundImage = null;

        for (const officialName in guests) {
            const officialTokens = officialName.split(" ");
            const inputTokens = inputRaw.split(/\s+/);
            
            if (officialTokens.length === inputTokens.length) {
                const match = officialTokens.every(token => inputTokens.includes(token));
                if (match) {
                    foundImage = guests[officialName];
                    break;
                }
            }
        }

        if (foundImage) {
            inviteImg.setAttribute('data-tried-jpeg', 'false');
            inviteImg.src = foundImage;
            inviteContainer.style.display = 'block';
            errorDiv.style.display = 'none';
            
            // 🎶 Avvia il suono magico
            playMagicSound();

            // 🎉 Avvia i coriandoli (Esplosione a sinistra e a destra)
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
            inviteContainer.style.display = 'none';
            errorDiv.style.display = 'block';
        }
    }

    function tryAlternativeExtension(img) {
        if (img.getAttribute('data-tried-jpeg') !== 'true') {
            img.setAttribute('data-tried-jpeg', 'true');
            if (img.src.endsWith('.jpg')) {
                img.src = img.src.replace('.jpg', '.jpeg');
            } else if (img.src.endsWith('.jpeg')) {
                img.src = img.src.replace('.jpeg', '.jpg');
            }
        }
    }
</script>

</body>
</html>
